<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>Nibras QR</title>
    <style>
      html, body { background: #000; }
      /* In-app splash: shown from the first HTML frame (before JS), removed by main.tsx ~2 s after launch. */
      #boot-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        background: #0f1621;
        transition: opacity 450ms ease, transform 600ms ease;
        pointer-events: none;
      }
      #boot-splash img {
        width: 100%; height: 100%;
        /* cover; bias toward the bottom so the "by Nibras Code" footer survives on shorter (16:9) screens */
        object-fit: cover; object-position: 50% 70%;
        display: block;
      }
      #boot-splash.hide { opacity: 0; transform: scale(1.04); }
    </style>
  </head>
  <body class="antialiased">
    <div id="boot-splash" aria-hidden="true"><img src="./splash.webp" alt="" decoding="async" fetchpriority="high" /></div>
    <div id="root"></div>
    <script type="module" src="../src/mobile/main.tsx"></script>
  </body>
</html>
