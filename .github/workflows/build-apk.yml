name: Android (APK + AAB)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # PUBLIC build-time config for the bundled app (repo Variables, not secrets):
      # Supabase backend, Google Web client id (native sign-in serverClientId),
      # RevenueCat Android public SDK key.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://rbnhwyvpuobdmgqjdiyj.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      VITE_REVENUECAT_ANDROID_API_KEY: ${{ vars.VITE_REVENUECAT_ANDROID_API_KEY }}
      # Every Play upload needs a higher versionCode. Local builds use 1 (first
      # Play upload). CI: repo variable ANDROID_VERSION_CODE if set (bump it per
      # release), else the workflow run number. build.gradle rejects values
      # outside 1..2100000000 (Play's limit).
      ANDROID_VERSION_CODE: ${{ vars.ANDROID_VERSION_CODE || github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ---------------------------------------------------------------- Google Play
      - name: Build bundled mobile web app for Google Play (mobile/dist)
        run: npm run build:mobile

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build Play debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assemblePlayDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: QR-debug-apk
          path: android/app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error

      - name: Build signed Play release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::warning::Signing secrets missing (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) - skipping release AAB."
            exit 0
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew bundlePlayRelease --no-daemon
          rm -f "$ANDROID_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: QR-release-aab
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: warn

      # ------------------------------------------------------ HUAWEI AppGallery
      # Same sources, VITE_STORE=huawei web bundle + `huawei` Android flavor
      # (HMS IAP, browser Google sign-in + email code). See docs/huawei.md.
      - name: Build bundled mobile web app for HUAWEI AppGallery
        env:
          VITE_STORE: huawei
          VITE_REVENUECAT_ANDROID_API_KEY: ''
          VITE_HUAWEI_IAP_PUBLIC_KEY: ${{ vars.HUAWEI_IAP_PUBLIC_KEY }}
        run: npm run build:mobile && npx cap copy android

      - name: Write agconnect-services.json (secret)
        env:
          AGCONNECT_SERVICES_JSON_BASE64: ${{ secrets.AGCONNECT_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$AGCONNECT_SERVICES_JSON_BASE64" ]; then
            echo "::warning::AGCONNECT_SERVICES_JSON_BASE64 secret missing - Huawei build uses the manifest app id only (AGConnect plugin not applied)."
            exit 0
          fi
          echo "$AGCONNECT_SERVICES_JSON_BASE64" | base64 -d > android/app/src/huawei/agconnect-services.json

      - name: Build Huawei debug APK
        working-directory: android
        run: ./gradlew assembleHuaweiDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: QR-huawei-debug-apk
          path: android/app/build/outputs/apk/huawei/debug/app-huawei-debug.apk
          if-no-files-found: error

      - name: Build signed Huawei release APK + AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::warning::Signing secrets missing - skipping Huawei release build."
            exit 0
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew assembleHuaweiRelease bundleHuaweiRelease --no-daemon
          rm -f "$ANDROID_KEYSTORE_FILE"

      - name: Remove agconnect-services.json
        if: always()
        run: rm -f android/app/src/huawei/agconnect-services.json

      - uses: actions/upload-artifact@v4
        with:
          name: QR-huawei-release
          path: |
            android/app/build/outputs/apk/huawei/release/app-huawei-release.apk
            android/app/build/outputs/bundle/huaweiRelease/app-huawei-release.aab
          if-no-files-found: warn
