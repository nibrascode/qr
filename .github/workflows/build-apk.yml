name: Android APK Yarat
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - run: npm install && npm run build
      - run: npm install @capacitor/core @capacitor/android && npm install -D @capacitor/cli && npx cap init "QR" "com.nibras.qr" --web-dir dist && npx cap add android && npx cap sync
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: QR-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
